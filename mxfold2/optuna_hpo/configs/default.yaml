# MXFold2 HPO Search Space Configuration
# This file defines the hyperparameter search space for Optuna optimization.

# ============================================================================
# Learning Parameters
# ============================================================================

# Optimizer selection
optimizer:
  - Adam
  - AdamW
  - RMSprop
  - SGD
  - AdaBelief
  - Lion

# Learning rate (log scale)
lr:
  min: 1.0e-4
  max: 1.0e-2
  log: true

# Learning rate scheduler
scheduler:
  - None
  - CyclicLR
  - CosineAnnealingLR

# ============================================================================
# Regularization Parameters
# ============================================================================

# Default dropout rate (fallback for all layers)
dropout_rate:
  min: 0.0
  max: 0.5

# Dropout rate for fully connected layers
fc_dropout_rate:
  min: 0.0
  max: 0.5

# Granular dropout rates (override default dropout_rate)
dropout_rate_1d_cnn:
  min: 0.0
  max: 0.5

dropout_rate_2d_cnn:
  min: 0.0
  max: 0.5

dropout_rate_lstm:
  min: 0.0
  max: 0.5

# L2 regularization weight (log scale)
l2_weight:
  min: 1.0e-5
  max: 1.0e-1
  log: true

# Gradient clipping (norm-based)
clip_grad_norm:
  min: 0.0
  max: 5.0

# ============================================================================
# Stochastic Depth Parameters
# ============================================================================
# Stochastic depth (drop path) regularization for ResNet blocks.
# Values represent survival probability (1.0 = disabled, lower = more aggressive).
# Can use either min/max range or categorical choices.
# Choices can be single values ("0.9") or layer-wise patterns ("0.95,0.90,0.85,0.80").

# Whether to optimize stochastic depth parameters
optimize_stochastic_depth: false

# 1D CNN stochastic depth (encoder CNN layers)
stochastic_depth_1d:
  min: 0.8
  max: 1.0
  # Uncomment below to use categorical choices instead of range:
  # choices:
  #   - "1.0"                                    # disabled
  #   - "0.9"                                    # mild (single value for all layers)
  #   - "0.95,0.90,0.85,0.80,0.75,0.70,0.65,0.60"  # progressive (layer-wise)
  #   - "0.90,0.80,0.70,0.60,0.50,0.40,0.30,0.20"  # aggressive progressive

# 2D CNN stochastic depth (paired layer CNN)
stochastic_depth_2d:
  min: 0.8
  max: 1.0
  # Uncomment below to use categorical choices instead of range:
  # choices:
  #   - "1.0"
  #   - "0.9"
  #   - "0.95,0.90,0.85,0.80,0.75,0.70,0.65,0.60"

# ============================================================================
# Model Architecture Parameters
# ============================================================================

# Embedding size (0 = one-hot encoding)
embed_size:
  - 0
  - 32
  - 64
  - 128

# Number of CNN filters per layer
num_filters:
  min: 32
  max: 128
  step: 16

# Filter size for CNN
filter_size:
  - 3
  - 5
  - 7

# Number of LSTM layers
num_lstm_layers:
  min: 0
  max: 3

# Number of LSTM units (only used when num_lstm_layers > 0)
num_lstm_units:
  min: 16
  max: 128
  step: 16

# Number of attention heads
num_att:
  - 0
  - 4
  - 8

# Method to join pair vectors
pair_join:
  - cat
  - add
  - mul

# ============================================================================
# Loss Function Parameters
# ============================================================================

# Loss function for BPSEQ data
loss_func:
  - hinge
  - fy
  - f1

# Perturbation for Fenchel-Young loss
perturb:
  min: 0.1
  max: 1.0

# Nu parameter for F1 loss (log scale)
nu:
  min: 1.0e-2
  max: 1.0
  log: true

# Score loss weight
score_loss_weight:
  min: 0.0
  max: 0.5

# ============================================================================
# SHAPE Loss Parameters
# ============================================================================

# Loss function for SHAPE data
shape_loss_func:
  - shape_nll
  - shape_fy
  - shape_rank

# SHAPE perturbation
shape_perturb:
  min: 0.1
  max: 1.0

# SHAPE nu parameter (log scale)
shape_nu:
  min: 0.1
  max: 10.0
  log: true

# SHAPE margin (only for shape_rank loss)
shape_margin:
  min: 0.0
  max: 1.0

# SHAPE pseudo FY weight (only for shape_rank and shape_nll)
# Uses Turner-predicted structure as pseudo ground truth for FY loss
shape_pseudo_fy_weight:
  min: 0.0
  max: 1.0

# ============================================================================
# SAM (Sharpness-Aware Minimization) Parameters
# ============================================================================

# SAM type (None = disabled)
sam_type:
  - None
  - SAM
  - ASAM
  - GSAM

# SAM rho parameter (perturbation radius, log scale)
# Only used when sam_type != None
sam_rho:
  min: 1.0e-2
  max: 1.0
  log: true

# SAM alpha parameter (only for GSAM)
sam_alpha:
  min: 1.0e-2
  max: 0.5

# ============================================================================
# Training Parameters
# ============================================================================

# Gradient accumulation steps
grad_accum_steps:
  - 1
  - 2
  - 4
  - 8
