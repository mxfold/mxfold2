# MXFold2 HPO - Optimizer Parameters Only
# Both network architecture and loss functions are fixed
# based on experiments/tuned-so_AdaBelief_shape-rank_pert0.5_nu10.0-margin0.2/

# ============================================================================
# Learning Parameters (TO BE OPTIMIZED)
# ============================================================================

optimizer:
  - Adam
  - AdamW
  - AdaBelief
  - Lion

lr:
  min: 0.0001
  max: 0.01
  log: true

scheduler:
  - None
  - CyclicLR
  - CosineAnnealingLR

dropout_rate:
  min: 0.0
  max: 0.5

fc_dropout_rate:
  min: 0.0
  max: 0.5

l2_weight:
  min: 0.001
  max: 0.1
  log: true

clip_grad_norm:
  min: 0.0
  max: 5.0

# ============================================================================
# Model Architecture (FIXED)
# ============================================================================

embed_size:
  - 64

num_filters:
  min: 64
  max: 64
  step: 16

filter_size:
  - 5

num_lstm_layers:
  min: 2
  max: 2

num_lstm_units:
  min: 32
  max: 32
  step: 16

num_att:
  - 8

pair_join:
  - cat

# ============================================================================
# Loss Function Parameters (FIXED to current best)
# ============================================================================

# Fixed: fy
loss_func:
  - fy

# Fixed: 0.75
perturb:
  min: 0.75
  max: 0.75

# Fixed: 0.1 (not used for fy)
nu:
  min: 0.1
  max: 0.1
  log: false

# Fixed: 0.125
score_loss_weight:
  min: 0.125
  max: 0.125

# ============================================================================
# SHAPE Loss Parameters (FIXED to current best)
# ============================================================================

# Fixed: shape_rank
shape_loss_func:
  - shape_rank

# Fixed: 0.5
shape_perturb:
  min: 0.5
  max: 0.5

# Fixed: 10.0
shape_nu:
  min: 10.0
  max: 10.0
  log: false

# Fixed: 0.2
shape_margin:
  min: 0.2
  max: 0.2
